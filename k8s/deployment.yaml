apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-manager

  template:
    metadata:
      labels:
        app: task-manager

    spec:
      containers:
        - name: task-manager
          image: 4taskmanager-task-manager:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          volumeMounts:
            - name: task-manager-storage
              mountPath: /app/backend/data

      volumes:
        - name: task-manager-storage
          persistentVolumeClaim:
            claimName: task-manager-pvc