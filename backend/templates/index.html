<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .container {
            width: 640px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        h2 {
            margin-top: 25px;
        }

        .add-form {
            display: flex;
            gap: 5px;
        }

        .add-form input {
            flex: 1;
            padding: 11px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 10px 14px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #2980b9;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #edf0f1;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .task-title {
            flex: 1;
            font-size: 16px;
        }

        .task button {
            flex-shrink: 0;
        }
        .completed {
           text-decoration: line-through;
           opacity: 0.6;
        }
        .task form {
            margin: 0;
        }
       .checkbox-form {
    margin: 0;
    display: flex;
    align-items: center;
}

.checkbox-form input {
    width: 18px;
    height: 18px;
    cursor: pointer;
} 
    </style>
</head>

<body>

    <div class="container">

        <h1>Tasks ({{ tasks|length }})</h1>

        <!-- Add Task -->
        <form class="add-form" action="/add" method="post">
            <input
                type="text"
                name="title"
                placeholder="Enter task"
                required
            >

            <button type="submit">Add Task</button>
        </form>

        <h2>Tasks</h2>

        <!-- Task List -->
        <div>

            {% for task in tasks %}

            <div class="task">

<form class="checkbox-form" action="/toggle/{{ task.id }}" method="post">
    <input
        type="checkbox"
        {% if task.completed %}checked{% endif %}
        onchange="this.form.submit()"
    >
</form>
<span class="task-title {% if task.completed %}completed{% endif %}">
    {{ task.title }}
</span>

{% if not task.completed %}
<form action="/complete/{{ task.id }}" method="post">
    <button type="submit">Complete</button>
</form>
{% endif %}

                <form action="/delete/{{ task.id }}" method="post">
    <button type="submit">Delete</button>
</form>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
